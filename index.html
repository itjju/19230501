function finish(){run=false;$('game').hidden=true;$('result').hidden=false;let t=Math.max(0,300-Math.floor(Math.max(0,time-65)+pen)*3),s=right*100+coins*5+t;$('score').textContent=s+'점';$('detail').textContent=`정답 ${right}/7 · 동전 ${coins}개 · 시간 ${Math.floor(time+pen)}초 · 시간점수 ${t}`;const record={name:$('nick').value.trim()||'탐험가',level:['초등','중등','고등'][level],correct:right,coins,time:Math.floor(time+pen),score:s};certificate(record);submitRecord(record)}
const API='https://script.google.com/macros/s/AKfycbwJwncfadSHyUkPprakcRirTUZjPql45qZJ4bVRLmPeTK4Jh7XJMNGXNl8VGfn4lsxk/exec';
async function loadRanking(){const box=$('ranking');box.textContent='순위 불러오는 중…';try{const res=await fetch(API+'?level='+encodeURIComponent(['초등','중등','고등'][level])+'&_='+Date.now(),{cache:'no-store'});const data=await res.json();if(!data.success||!Array.isArray(data.ranking))throw Error('조회 실패');box.replaceChildren();for(const r of data.ranking){const p=document.createElement('p');p.textContent=`${r.rank}위 ${r.name} — ${r.score}점 (정답 ${r.correct}/7 · 동전 ${r.coins} · ${r.time}초)`;box.append(p)}if(!data.ranking.length)box.textContent='아직 등록된 기록이 없습니다.';return data.ranking}catch(e){box.textContent='순위를 불러오지 못했습니다. 웹 앱 접근 권한을 확인하거나 새로고침해 주세요.';return null}}
async function submitRecord(record){const status=$('saveStatus');status.textContent='점수 전송 중…';try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(record)});const data=await res.json();if(!data.success)throw Error('저장 실패');status.textContent='구글 시트에 점수가 저장되었습니다.';const rows=await loadRanking();const match=rows?.find(r=>r.name===record.name&&r.score===record.score&&r.time===record.time&&r.coins===record.coins&&r.correct===record.correct);if(match)status.textContent+=' 동일 기록의 순위: '+match.rank+'위';}catch(e){status.textContent='저장 응답을 확인하지 못했습니다. 중복 등록 방지를 위해 자동 재전송하지 않습니다. 선생님께 확인해 주세요.';await loadRanking()}}
$('refreshRank').onclick=loadRanking;

function loop(now){if(!run)return;let dt=Math.min(.04,(now-last)/1000||0);last=now;if(!locked){if(wait>0)wait=Math.max(0,wait-dt);else{time+=dt;inv=Math.max(0,inv-dt);stun=Math.max(0,stun-dt);let old=y;if(stun===0)x+=(level===0?200:level===1?225:250)*dt;v+=1050*dt;y+=v*dt;ground=false;if(y>=G-32){y=G-32;v=0;ground=true}for(let o of items){if(o.done)continue;if(o.spawn!==undefined){if(!o.active&&x>=o.spawn)o.active=true;if(o.active){o.x-=100*dt;if(o.t==='bird')o.y=G-40+Math.sin(time*5)*9}else continue}if(o.t==='coin'){if(Math.hypot(x+14-o.x,y+15-o.y)<20){coins++;o.done=true}}else if(o.t==='box'){if(x+24>o.x&&x<o.x+24&&v<0&&old>=o.y+24&&y<=o.y+24){y=o.y+24;v=20;o.done=true;coins+=5;$('notice').textContent='보너스 동전 +5!'}}else if(x+23>o.x-5&&x<o.x+(o.w||15)&&y+32>o.y-8&&y<o.y+(o.h||15)){if(o.t==='wall'&&old+32<=o.y+3&&v>=0){y=o.y-32;v=0;ground=true}else hit()}}if(x>=(idx+1)*L){x=(idx+1)*L;ask()}}}let cam=Math.max(0,x-80),i=Math.min(idx,6);scene(ctx,i,cam);for(let o of items){let a=o.x-cam;if(a< -40||a>520||o.done&&o.t!=='box'||o.spawn!==undefined&&!o.active)continue;if(o.t==='coin')coin(ctx,a,o.y);if(o.t==='wall'){R(ctx,a,o.y,26,24,'#a57554');R(ctx,a,o.y+10,26,2,'#79533e');R(ctx,a+12,o.y,2,10,'#79533e')}if(o.t==='box'){R(ctx,a,o.y,24,24,o.done?'#aaa08c':'#e7ad37');ctx.fillStyle='#fff';ctx.font='bold 20px monospace';ctx.fillText(o.done?'·':'?',a+6,o.y+19)}if(o.t==='bird'){R(ctx,a-8,o.y-5,18,10,'#a36f60');R(ctx,a+2,o.y-10+Math.sin(time*18)*5,12,8,'#e6a88a');R(ctx,a-12,o.y,5,3,'#e8b74e')}if(o.t==='roll'){R(ctx,a-8,o.y-8,17,17,'#80674e');R(ctx,a-5,o.y-5,11,11,'#bd986d')}}let flag=(idx+1)*L-cam;R(ctx,flag,G-70,3,70,'#675b50');R(ctx,flag+3,G-70,30,20,'#e6b14c');if(inv===0||Math.floor(inv*12)%2===0)person(ctx,x-cam,y,skin);if(wait>0){R(ctx,0,0,480,210,'#403c3877');ctx.fillStyle='white';ctx.font='bold 40px monospace';ctx.fillText(Math.ceil(wait),225,110)}$('stage').textContent=`STAGE ${i+1} · ${map(i)[0]}`;$('hud').textContent=`🪙 ${coins}　 📚 ${idx}/7　 ⏱ ${Math.floor(time+pen)}초　 ⭐ ${right*100+coins*5}`;$('progress').value=x/END;requestAnimationFrame(loop)}
</script></html>
